spring.application.name=reservas-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=reservas_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:TuPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
app.export.path=./data/reservas.xlsx